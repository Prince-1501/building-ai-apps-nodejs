<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420">
  <defs>
    <style>
      text { font-family: Consolas, monospace; font-size: 13px; fill: #333; }
      .folder { fill: #D4A843; }
      .file { fill: #4A90D9; }
      .desc { font-family: Arial, sans-serif; font-size: 11px; fill: #888; }
    </style>
  </defs>
  <rect width="480" height="420" fill="white"/>

  <rect x="20" y="15" width="14" height="12" rx="2" class="folder"/>
  <text x="40" y="26">ai-support-chatbot/</text>

  <rect x="40" y="45" width="10" height="12" rx="1" class="file"/>
  <text x="56" y="56">package.json</text>
  <text x="250" y="56" class="desc">Dependencies</text>

  <rect x="40" y="70" width="10" height="12" rx="1" class="file"/>
  <text x="56" y="81">.env.example</text>
  <text x="250" y="81" class="desc">API keys</text>

  <rect x="40" y="95" width="10" height="12" rx="1" class="file"/>
  <text x="56" y="106">server.js</text>
  <text x="250" y="106" class="desc">Express.js server</text>

  <rect x="40" y="120" width="10" height="12" rx="1" class="file"/>
  <text x="56" y="131">chatEngine.js</text>
  <text x="250" y="131" class="desc">RAG + history + escalation</text>

  <rect x="40" y="145" width="10" height="12" rx="1" class="file"/>
  <text x="56" y="156">knowledgeBase.js</text>
  <text x="250" y="156" class="desc">Embed + store + retrieve</text>

  <rect x="40" y="170" width="10" height="12" rx="1" class="file"/>
  <text x="56" y="181">conversationLogger.js</text>
  <text x="250" y="181" class="desc">JSON log files</text>

  <rect x="40" y="195" width="10" height="12" rx="1" class="file"/>
  <text x="56" y="206">ingest.js</text>
  <text x="250" y="206" class="desc">Load articles into Pinecone</text>

  <rect x="40" y="230" width="14" height="12" rx="2" class="folder"/>
  <text x="60" y="241">public/</text>

  <rect x="64" y="255" width="10" height="12" rx="1" class="file"/>
  <text x="80" y="266">index.html</text>
  <rect x="64" y="280" width="10" height="12" rx="1" class="file"/>
  <text x="80" y="291">style.css</text>
  <rect x="64" y="305" width="10" height="12" rx="1" class="file"/>
  <text x="80" y="316">app.js</text>

  <rect x="40" y="340" width="14" height="12" rx="2" class="folder"/>
  <text x="60" y="351">knowledge/</text>
  <text x="250" y="351" class="desc">Support articles</text>

  <rect x="64" y="365" width="10" height="12" rx="1" class="file"/>
  <text x="80" y="376">returns.txt, shipping.txt ...</text>

  <rect x="40" y="395" width="14" height="12" rx="2" class="folder"/>
  <text x="60" y="406">logs/</text>
  <text x="250" y="406" class="desc">Conversation logs</text>

  <!-- Tree lines -->
  <line x1="30" y1="35" x2="30" y2="400" stroke="#ccc" stroke-width="1"/>
  <line x1="30" y1="52" x2="40" y2="52" stroke="#ccc" stroke-width="1"/>
  <line x1="30" y1="77" x2="40" y2="77" stroke="#ccc" stroke-width="1"/>
  <line x1="30" y1="102" x2="40" y2="102" stroke="#ccc" stroke-width="1"/>
  <line x1="30" y1="127" x2="40" y2="127" stroke="#ccc" stroke-width="1"/>
  <line x1="30" y1="152" x2="40" y2="152" stroke="#ccc" stroke-width="1"/>
  <line x1="30" y1="177" x2="40" y2="177" stroke="#ccc" stroke-width="1"/>
  <line x1="30" y1="202" x2="40" y2="202" stroke="#ccc" stroke-width="1"/>
  <line x1="30" y1="237" x2="40" y2="237" stroke="#ccc" stroke-width="1"/>
  <line x1="30" y1="347" x2="40" y2="347" stroke="#ccc" stroke-width="1"/>
  <line x1="30" y1="400" x2="40" y2="400" stroke="#ccc" stroke-width="1"/>

  <line x1="54" y1="248" x2="54" y2="312" stroke="#ccc" stroke-width="1"/>
  <line x1="54" y1="262" x2="64" y2="262" stroke="#ccc" stroke-width="1"/>
  <line x1="54" y1="287" x2="64" y2="287" stroke="#ccc" stroke-width="1"/>
  <line x1="54" y1="312" x2="64" y2="312" stroke="#ccc" stroke-width="1"/>

  <line x1="54" y1="358" x2="54" y2="372" stroke="#ccc" stroke-width="1"/>
  <line x1="54" y1="372" x2="64" y2="372" stroke="#ccc" stroke-width="1"/>
</svg>
