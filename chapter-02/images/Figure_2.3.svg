<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif; background: transparent;">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- Text data input -->
<rect x="40" y="30" width="120" height="50" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1"/>
<text x="100" y="50" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#3C3489">Text data</text>
<text x="100" y="68" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#534AB7">"I love to learn"</text>

<!-- Arrow down to tokens -->
<line x1="100" y1="80" x2="100" y2="108" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="140" y="98" font-size="10" fill="#5F5E5A">Tokenization</text>

<!-- Tokens box -->
<rect x="30" y="110" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="100" y="128" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#0C447C">['I', 'love', 'to', 'learn']</text>
<text x="100" y="145" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#185FA5">Tokens</text>

<!-- Arrow to Transformer -->
<line x1="170" y1="132" x2="228" y2="132" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>

<!-- Transformer box -->
<rect x="230" y="95" width="150" height="75" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.5"/>
<line x1="280" y1="95" x2="280" y2="170" stroke="#EF9F27" stroke-width="0.5" opacity="0.4"/>
<line x1="330" y1="95" x2="330" y2="170" stroke="#EF9F27" stroke-width="0.5" opacity="0.4"/>
<line x1="230" y1="120" x2="380" y2="120" stroke="#EF9F27" stroke-width="0.5" opacity="0.4"/>
<line x1="230" y1="145" x2="380" y2="145" stroke="#EF9F27" stroke-width="0.5" opacity="0.4"/>
<text x="305" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#633806">Transformer</text>

<!-- Arrow to Training (horizontal then up) -->
<path d="M380 115 L420 115 L420 50 L478 50" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="450" y="42" text-anchor="middle" font-size="10" fill="#5F5E5A">Training</text>

<!-- Arrow to Generation (horizontal then down) -->
<path d="M380 150 L420 150 L420 230 L478 230" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="450" y="248" text-anchor="middle" font-size="10" fill="#5F5E5A">Generation</text>

<!-- Training box -->
<rect x="480" y="25" width="170" height="55" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
<text x="565" y="47" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">Training</text>
<text x="565" y="66" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#993C1D">Predict the next word</text>

<!-- Generation box -->
<rect x="480" y="205" width="170" height="55" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
<text x="565" y="227" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">Generation</text>
<text x="565" y="246" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#0F6E56">Text output</text>

</svg>
