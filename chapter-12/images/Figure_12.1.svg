<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .label { font-size: 12px; fill: #333; text-anchor: middle; }
      .sublabel { font-size: 10px; fill: #666; text-anchor: middle; }
      .arrow-label { font-size: 10px; fill: #555; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <rect width="800" height="340" fill="white"/>

  <!-- User -->
  <rect x="30" y="130" width="100" height="70" rx="8" fill="#E6F1FB" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="80" y="160" class="label">User</text>
  <text x="80" y="178" class="sublabel">CLI Input</text>

  <!-- Arrow: User → Agent -->
  <line x1="130" y1="165" x2="180" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Agent Box (big) -->
  <rect x="180" y="60" width="240" height="210" rx="8" fill="#FAEEDA" stroke="#D4A843" stroke-width="1.5"/>
  <text x="300" y="85" class="label">agent.mjs</text>

  <!-- Gemini inside Agent -->
  <rect x="200" y="100" width="200" height="50" rx="6" fill="#EEEDFE" stroke="#8B7FC7" stroke-width="1"/>
  <text x="300" y="122" class="label">Gemini</text>
  <text x="300" y="138" class="sublabel">gemini-2.5-flash</text>

  <!-- MCP Client inside Agent -->
  <rect x="200" y="165" width="200" height="50" rx="6" fill="white" stroke="#D4A843" stroke-width="1"/>
  <text x="300" y="187" class="label">MCP Client</text>
  <text x="300" y="202" class="sublabel">StdioClientTransport</text>

  <!-- Conversation Memory -->
  <rect x="200" y="225" width="200" height="30" rx="6" fill="white" stroke="#D4A843" stroke-width="1"/>
  <text x="300" y="245" class="sublabel">Conversation Memory</text>

  <!-- Arrow: Agent → MCP Server -->
  <line x1="420" y1="190" x2="480" y2="190" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="450" y="180" class="arrow-label">stdio</text>

  <!-- MCP Server Box -->
  <rect x="480" y="60" width="130" height="210" rx="8" fill="#FAECE7" stroke="#D97452" stroke-width="1.5"/>
  <text x="545" y="85" class="label">MCP Server</text>
  <text x="545" y="100" class="sublabel">mcp-server.mjs</text>

  <rect x="495" y="112" width="100" height="22" rx="3" fill="white" stroke="#D97452" stroke-width="1"/>
  <text x="545" y="127" class="sublabel">read_file</text>
  <rect x="495" y="140" width="100" height="22" rx="3" fill="white" stroke="#D97452" stroke-width="1"/>
  <text x="545" y="155" class="sublabel">write_file</text>
  <rect x="495" y="168" width="100" height="22" rx="3" fill="white" stroke="#D97452" stroke-width="1"/>
  <text x="545" y="183" class="sublabel">list_files</text>
  <rect x="495" y="196" width="100" height="22" rx="3" fill="white" stroke="#D97452" stroke-width="1"/>
  <text x="545" y="211" class="sublabel">calculate</text>
  <rect x="495" y="224" width="100" height="22" rx="3" fill="white" stroke="#D97452" stroke-width="1"/>
  <text x="545" y="239" class="sublabel">get_datetime</text>

  <!-- Arrow: MCP Server → Workspace -->
  <line x1="610" y1="165" x2="660" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Workspace -->
  <rect x="660" y="120" width="110" height="90" rx="8" fill="#E1F5EE" stroke="#4CAF72" stroke-width="1.5"/>
  <text x="715" y="155" class="label">workspace/</text>
  <text x="715" y="175" class="sublabel">Files on disk</text>
  <text x="715" y="195" class="sublabel">sample.txt</text>
</svg>
