<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .label { font-size: 12px; fill: #333; text-anchor: middle; }
      .sublabel { font-size: 10px; fill: #666; text-anchor: middle; }
      .step { font-size: 10px; fill: white; text-anchor: middle; font-weight: bold; }
    </style>
    <marker id="fw" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  <rect width="800" height="240" fill="white"/>

  <rect x="20" y="70" width="120" height="70" rx="6" fill="#E6F1FB" stroke="#4A90D9" stroke-width="1.5"/>
  <circle cx="40" cy="85" r="10" fill="#4A90D9"/>
  <text x="40" y="89" class="step">1</text>
  <text x="80" y="105" class="label">Validate</text>
  <text x="80" y="120" class="sublabel">Environment</text>
  <text x="80" y="132" class="sublabel">variables</text>

  <line x1="140" y1="105" x2="165" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#fw)"/>

  <rect x="165" y="70" width="120" height="70" rx="6" fill="#FAECE7" stroke="#D97452" stroke-width="1.5"/>
  <circle cx="185" cy="85" r="10" fill="#D97452"/>
  <text x="185" y="89" class="step">2</text>
  <text x="225" y="105" class="label">Security</text>
  <text x="225" y="120" class="sublabel">NODE_ENV</text>
  <text x="225" y="132" class="sublabel">Error handling</text>

  <line x1="285" y1="105" x2="310" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#fw)"/>

  <rect x="310" y="70" width="120" height="70" rx="6" fill="#E1F5EE" stroke="#4CAF72" stroke-width="1.5"/>
  <circle cx="330" cy="85" r="10" fill="#4CAF72"/>
  <text x="330" y="89" class="step">3</text>
  <text x="370" y="105" class="label">Health check</text>
  <text x="370" y="120" class="sublabel">GET /health</text>
  <text x="370" y="132" class="sublabel">endpoint</text>

  <line x1="430" y1="105" x2="455" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#fw)"/>

  <rect x="455" y="70" width="120" height="70" rx="6" fill="#FAEEDA" stroke="#D4A843" stroke-width="1.5"/>
  <circle cx="475" cy="85" r="10" fill="#D4A843"/>
  <text x="475" y="89" class="step">4</text>
  <text x="515" y="105" class="label">Push</text>
  <text x="515" y="120" class="sublabel">GitHub repo</text>
  <text x="515" y="132" class="sublabel">.env in .gitignore</text>

  <line x1="575" y1="105" x2="600" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#fw)"/>

  <rect x="600" y="70" width="120" height="70" rx="6" fill="#EEEDFE" stroke="#8B7FC7" stroke-width="1.5"/>
  <circle cx="620" cy="85" r="10" fill="#8B7FC7"/>
  <text x="620" y="89" class="step">5</text>
  <text x="660" y="105" class="label">Deploy</text>
  <text x="660" y="120" class="sublabel">Railway / Render</text>
  <text x="660" y="132" class="sublabel">Set env vars</text>

  <line x1="720" y1="105" x2="745" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#fw)"/>
  <circle cx="763" cy="105" r="16" fill="#27ae60"/>
  <polyline points="754,105 761,112 774,100" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
