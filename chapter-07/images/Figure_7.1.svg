<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" font-family="Palatino Linotype, serif" font-size="13">
  <text x="350" y="25" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">The Problem: LLMs and Private Data</text>

  <!-- User -->
  <rect x="30" y="70" width="160" height="40" rx="5" fill="#E6F1FB" stroke="#2B6CB0" stroke-width="1.2"/>
  <text x="110" y="95" text-anchor="middle" font-weight="bold" fill="#1a1a1a">User Question</text>

  <!-- Arrow -->
  <line x1="190" y1="90" x2="250" y2="90" stroke="#555" stroke-width="1.2"/>
  <polygon points="248,86 248,94 255,90" fill="#555"/>

  <!-- LLM -->
  <rect x="255" y="60" width="190" height="60" rx="5" fill="#FAEEDA" stroke="#B7791F" stroke-width="1.2"/>
  <text x="350" y="85" text-anchor="middle" font-weight="bold" fill="#1a1a1a">LLM (Gemini)</text>
  <text x="350" y="105" text-anchor="middle" font-size="10" fill="#888">Trained on public internet data</text>

  <!-- Arrow to answer -->
  <line x1="445" y1="90" x2="505" y2="90" stroke="#555" stroke-width="1.2"/>
  <polygon points="503,86 503,94 510,90" fill="#555"/>

  <!-- Answer box - bad -->
  <rect x="510" y="65" width="170" height="50" rx="5" fill="#FAECE7" stroke="#E74C3C" stroke-width="1.2"/>
  <text x="595" y="87" text-anchor="middle" font-weight="bold" fill="#E74C3C">Hallucinated</text>
  <text x="595" y="104" text-anchor="middle" font-size="10" fill="#E74C3C">Answer</text>

  <!-- Private docs - crossed out -->
  <rect x="280" y="155" width="140" height="65" rx="5" fill="#F8F9FA" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="350" y="178" text-anchor="middle" font-size="12" fill="#555">Company Docs</text>
  <text x="350" y="195" text-anchor="middle" font-size="12" fill="#555">Personal Notes</text>
  <text x="350" y="212" text-anchor="middle" font-size="12" fill="#555">Internal Reports</text>

  <!-- X mark -->
  <line x1="350" y1="125" x2="350" y2="150" stroke="#E74C3C" stroke-width="1.5"/>
  <text x="370" y="142" font-size="16" fill="#E74C3C" font-weight="bold">&#x2717;</text>
  <text x="400" y="142" font-size="10" fill="#E74C3C">No access</text>
</svg>
