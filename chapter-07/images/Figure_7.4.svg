<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Palatino Linotype, serif" font-size="13">
  <text x="350" y="25" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Document Q&amp;A System Architecture</text>

  <!-- Input doc -->
  <rect x="30" y="55" width="130" height="40" rx="5" fill="#E6F1FB" stroke="#2B6CB0" stroke-width="1.2"/>
  <text x="95" y="80" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Text File</text>

  <line x1="160" y1="75" x2="195" y2="75" stroke="#555" stroke-width="1"/>
  <polygon points="193,71 193,79 200,75" fill="#555"/>

  <!-- Chunk -->
  <rect x="200" y="55" width="110" height="40" rx="5" fill="#FAEEDA" stroke="#B7791F" stroke-width="1.2"/>
  <text x="255" y="80" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Chunk</text>

  <line x1="310" y1="75" x2="345" y2="75" stroke="#555" stroke-width="1"/>
  <polygon points="343,71 343,79 350,75" fill="#555"/>

  <!-- Embed -->
  <rect x="350" y="55" width="110" height="40" rx="5" fill="#FAEEDA" stroke="#B7791F" stroke-width="1.2"/>
  <text x="405" y="80" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Embed</text>

  <line x1="460" y1="75" x2="495" y2="75" stroke="#555" stroke-width="1"/>
  <polygon points="493,71 493,79 500,75" fill="#555"/>

  <!-- Pinecone -->
  <rect x="500" y="50" width="140" height="50" rx="5" fill="#E1F5EE" stroke="#276749" stroke-width="1.5"/>
  <text x="570" y="73" text-anchor="middle" font-weight="bold" fill="#276749">Pinecone</text>
  <text x="570" y="90" text-anchor="middle" font-size="10" fill="#555">Vector Database</text>

  <!-- Divider -->
  <line x1="30" y1="120" x2="670" y2="120" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="350" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#888">Query Phase (interactive)</text>

  <!-- User -->
  <rect x="30" y="160" width="130" height="40" rx="5" fill="#EEEDFE" stroke="#6B46C1" stroke-width="1.2"/>
  <text x="95" y="185" text-anchor="middle" font-weight="bold" fill="#6B46C1">User Question</text>

  <line x1="160" y1="180" x2="195" y2="180" stroke="#555" stroke-width="1"/>
  <polygon points="193,176 193,184 200,180" fill="#555"/>

  <!-- Embed query -->
  <rect x="200" y="160" width="110" height="40" rx="5" fill="#FAEEDA" stroke="#B7791F" stroke-width="1.2"/>
  <text x="255" y="185" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Embed</text>

  <line x1="310" y1="180" x2="345" y2="180" stroke="#555" stroke-width="1"/>
  <polygon points="343,176 343,184 350,180" fill="#555"/>

  <!-- Search -->
  <rect x="350" y="160" width="110" height="40" rx="5" fill="#E1F5EE" stroke="#276749" stroke-width="1.2"/>
  <text x="405" y="185" text-anchor="middle" font-weight="bold" fill="#276749">Search</text>

  <!-- Connection to Pinecone -->
  <line x1="570" y1="100" x2="570" y2="160" stroke="#276749" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="570" y1="160" x2="405" y2="160" stroke="#276749" stroke-width="1" stroke-dasharray="4,3"/>

  <line x1="405" y1="200" x2="405" y2="230" stroke="#555" stroke-width="1"/>
  <polygon points="400,228 410,228 405,235" fill="#555"/>
  <text x="430" y="218" font-size="10" fill="#888">top 3 chunks</text>

  <!-- Generate -->
  <rect x="330" y="238" width="150" height="40" rx="5" fill="#FAEEDA" stroke="#B7791F" stroke-width="1.2"/>
  <text x="405" y="258" text-anchor="middle" font-size="11" fill="#888">Gemini 2.5 Flash</text>
  <text x="405" y="273" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Generate</text>

  <line x1="480" y1="258" x2="530" y2="258" stroke="#555" stroke-width="1"/>
  <polygon points="528,254 528,262 535,258" fill="#555"/>

  <!-- Answer -->
  <rect x="535" y="240" width="130" height="36" rx="5" fill="#E1F5EE" stroke="#276749" stroke-width="1.5"/>
  <text x="600" y="263" text-anchor="middle" font-weight="bold" fill="#276749">Answer</text>
</svg>
