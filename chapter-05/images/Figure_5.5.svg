<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Palatino Linotype, serif" font-size="14">
  <!-- Task input -->
  <rect x="250" y="15" width="200" height="45" rx="6" fill="#EEEDFE" stroke="#6B46C1" stroke-width="1.5"/>
  <text x="350" y="43" text-anchor="middle" font-weight="bold" fill="#1a1a1a">User Task</text>

  <!-- Arrow down -->
  <line x1="350" y1="60" x2="350" y2="95" stroke="#555" stroke-width="1.5"/>
  <polygon points="345,93 355,93 350,101" fill="#555"/>

  <!-- Smart Router -->
  <rect x="220" y="102" width="260" height="55" rx="6" fill="#FAEEDA" stroke="#B7791F" stroke-width="1.5"/>
  <text x="350" y="125" text-anchor="middle" font-weight="bold" font-size="16" fill="#1a1a1a">Smart Router</text>
  <text x="350" y="145" text-anchor="middle" font-size="12" fill="#666">chooseProvider(taskType)</text>

  <!-- Two branches -->
  <!-- Left: Cloud tasks -->
  <line x1="300" y1="157" x2="160" y2="200" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="120" y="175" font-size="11" fill="#2B6CB0">general, creative</text>
  <text x="120" y="188" font-size="11" fill="#2B6CB0">analysis, translate</text>

  <!-- Right: Local tasks -->
  <line x1="400" y1="157" x2="540" y2="200" stroke="#276749" stroke-width="1.5"/>
  <text x="530" y="175" font-size="11" fill="#276749">private, offline</text>
  <text x="530" y="188" font-size="11" fill="#276749">journal, medical</text>

  <!-- Gemini box -->
  <rect x="70" y="200" width="180" height="50" rx="5" fill="#E6F1FB" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="160" y="222" text-anchor="middle" font-weight="bold" fill="#2B6CB0">Gemini</text>
  <text x="160" y="240" text-anchor="middle" font-size="11" fill="#555">Cloud (free)</text>

  <!-- Ollama box -->
  <rect x="450" y="200" width="180" height="50" rx="5" fill="#E1F5EE" stroke="#276749" stroke-width="1.5"/>
  <text x="540" y="222" text-anchor="middle" font-weight="bold" fill="#276749">Ollama</text>
  <text x="540" y="240" text-anchor="middle" font-size="11" fill="#555">Local (free)</text>

  <!-- Fallback arrows (dashed, between the two) -->
  <line x1="250" y1="230" x2="450" y2="230" stroke="#E74C3C" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="350" y="222" text-anchor="middle" font-size="11" fill="#E74C3C">Fallback</text>

  <!-- Arrow tips on dashed line -->
  <polygon points="445,226 445,234 452,230" fill="#E74C3C"/>
  <polygon points="255,226 255,234 248,230" fill="#E74C3C"/>

  <!-- Response arrows down -->
  <line x1="160" y1="250" x2="160" y2="290" stroke="#555" stroke-width="1"/>
  <line x1="540" y1="250" x2="540" y2="290" stroke="#555" stroke-width="1"/>

  <!-- Merge -->
  <line x1="160" y1="290" x2="350" y2="320" stroke="#555" stroke-width="1"/>
  <line x1="540" y1="290" x2="350" y2="320" stroke="#555" stroke-width="1"/>

  <!-- Response box -->
  <rect x="250" y="320" width="200" height="45" rx="6" fill="#E1F5EE" stroke="#276749" stroke-width="1.5"/>
  <text x="350" y="348" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Response</text>

  <!-- Labels -->
  <text x="120" y="305" font-size="11" fill="#888">success</text>
  <text x="545" y="305" font-size="11" fill="#888">success</text>
</svg>
