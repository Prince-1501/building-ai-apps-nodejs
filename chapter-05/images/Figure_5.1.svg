<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Palatino Linotype, serif" font-size="14">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">AI Model Landscape</text>

  <!-- Your App box -->
  <rect x="310" y="55" width="180" height="45" rx="6" fill="#E6F1FB" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="400" y="83" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Node.js App</text>

  <!-- Connection lines from app to branches -->
  <line x1="400" y1="100" x2="400" y2="130" stroke="#555" stroke-width="1.5"/>
  <line x1="400" y1="130" x2="220" y2="150" stroke="#555" stroke-width="1.5"/>
  <line x1="400" y1="130" x2="580" y2="150" stroke="#555" stroke-width="1.5"/>
  <!-- Arrow tips at branch ends -->
  <polygon points="215,147 225,147 220,154" fill="#555"/>
  <polygon points="575,147 585,147 580,154" fill="#555"/>

  <!-- Cloud branch -->
  <rect x="60" y="150" width="320" height="35" rx="5" fill="#FAEEDA" stroke="#B7791F" stroke-width="1.2"/>
  <text x="220" y="173" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Cloud API Providers</text>

  <!-- Local branch -->
  <rect x="420" y="150" width="320" height="35" rx="5" fill="#E1F5EE" stroke="#276749" stroke-width="1.2"/>
  <text x="580" y="173" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Local Models (Ollama)</text>

  <!-- Cloud providers -->
  <rect x="30" y="210" width="140" height="80" rx="5" fill="#fff" stroke="#2B6CB0" stroke-width="1.2"/>
  <text x="100" y="235" text-anchor="middle" font-weight="bold" fill="#2B6CB0">Google</text>
  <text x="100" y="255" text-anchor="middle" font-size="12" fill="#555">Gemini 2.5 Flash</text>
  <text x="100" y="272" text-anchor="middle" font-size="11" fill="#27AE60">Free tier</text>

  <rect x="190" y="210" width="140" height="80" rx="5" fill="#fff" stroke="#2B6CB0" stroke-width="1.2"/>
  <text x="260" y="235" text-anchor="middle" font-weight="bold" fill="#2B6CB0">OpenAI</text>
  <text x="260" y="255" text-anchor="middle" font-size="12" fill="#555">GPT-4o-mini</text>
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#E67E22">Paid</text>

  <rect x="30" y="305" width="140" height="80" rx="5" fill="#fff" stroke="#2B6CB0" stroke-width="1.2"/>
  <text x="100" y="330" text-anchor="middle" font-weight="bold" fill="#2B6CB0">Anthropic</text>
  <text x="100" y="350" text-anchor="middle" font-size="12" fill="#555">Claude Sonnet</text>
  <text x="100" y="367" text-anchor="middle" font-size="11" fill="#E67E22">Paid</text>

  <rect x="190" y="305" width="140" height="80" rx="5" fill="#fff" stroke="#2B6CB0" stroke-width="1.2"/>
  <text x="260" y="330" text-anchor="middle" font-weight="bold" fill="#2B6CB0">HuggingFace</text>
  <text x="260" y="350" text-anchor="middle" font-size="12" fill="#555">Community models</text>
  <text x="260" y="367" text-anchor="middle" font-size="11" fill="#27AE60">Free (limited)</text>

  <!-- Local models -->
  <rect x="420" y="210" width="140" height="80" rx="5" fill="#fff" stroke="#276749" stroke-width="1.2"/>
  <text x="490" y="235" text-anchor="middle" font-weight="bold" fill="#276749">LLaMA 3.2</text>
  <text x="490" y="255" text-anchor="middle" font-size="12" fill="#555">Meta (3B)</text>
  <text x="490" y="272" text-anchor="middle" font-size="11" fill="#27AE60">Free, ~2 GB</text>

  <rect x="580" y="210" width="140" height="80" rx="5" fill="#fff" stroke="#276749" stroke-width="1.2"/>
  <text x="650" y="235" text-anchor="middle" font-weight="bold" fill="#276749">Gemma 2</text>
  <text x="650" y="255" text-anchor="middle" font-size="12" fill="#555">Google (2B/9B)</text>
  <text x="650" y="272" text-anchor="middle" font-size="11" fill="#27AE60">Free</text>

  <rect x="420" y="305" width="140" height="80" rx="5" fill="#fff" stroke="#276749" stroke-width="1.2"/>
  <text x="490" y="330" text-anchor="middle" font-weight="bold" fill="#276749">Mistral 7B</text>
  <text x="490" y="350" text-anchor="middle" font-size="12" fill="#555">Mistral AI</text>
  <text x="490" y="367" text-anchor="middle" font-size="11" fill="#27AE60">Free</text>

  <rect x="580" y="305" width="140" height="80" rx="5" fill="#fff" stroke="#276749" stroke-width="1.2"/>
  <text x="650" y="330" text-anchor="middle" font-weight="bold" fill="#276749">Phi-3</text>
  <text x="650" y="350" text-anchor="middle" font-size="12" fill="#555">Microsoft (3.8B)</text>
  <text x="650" y="367" text-anchor="middle" font-size="11" fill="#27AE60">Free</text>

  <!-- Labels on branches -->
  <text x="220" y="200" text-anchor="middle" font-size="11" fill="#888">Internet required</text>
  <text x="580" y="200" text-anchor="middle" font-size="11" fill="#888">No internet needed</text>
</svg>
