<svg width="100%" viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif; background: transparent;">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- WITHOUT HISTORY -->
<text x="340" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#5F5E5A">Without history</text>

