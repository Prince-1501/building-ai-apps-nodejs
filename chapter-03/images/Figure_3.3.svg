<text x="100" y="52" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#0C447C">Message 1</text>

<line x1="160" y1="52" x2="218" y2="52" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>

<rect x="220" y="30" width="80" height="44" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
<text x="260" y="52" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">AI</text>

<rect x="340" y="30" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="400" y="52" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#0C447C">Message 2</text>

<line x1="460" y1="52" x2="518" y2="52" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>

<rect x="520" y="30" width="120" height="44" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
<text x="580" y="46" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">AI</text>
<text x="580" y="63" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#993C1D">No memory</text>

<!-- WITH HISTORY -->
<text x="340" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#5F5E5A">With history (chat session)</text>

<rect x="40" y="130" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
