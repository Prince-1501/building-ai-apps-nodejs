<line x1="450" y1="152" x2="518" y2="152" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>

<rect x="520" y="130" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="580" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#0C447C">Message 2</text>

