<line x1="160" y1="152" x2="228" y2="152" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>

<rect x="230" y="125" width="220" height="54" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
