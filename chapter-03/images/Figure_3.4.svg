<svg width="100%" viewBox="0 0 680 150" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif; background: transparent;">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="30" y="20" width="110" height="50" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="85" y="40" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#0C447C">Terminal</text>
<text x="85" y="56" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#185FA5">User input</text>

<rect x="210" y="20" width="130" height="50" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
<text x="275" y="40" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">chatbot.js</text>
<text x="275" y="56" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#854F0B">Chat + Stream</text>

<rect x="410" y="20" width="120" height="50" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
<text x="470" y="40" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">Gemini API</text>
<text x="470" y="56" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#0F6E56">AI model</text>

<rect x="580" y="20" width="80" height="50" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1"/>
<text x="620" y="40" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#3C3489">.env</text>
<text x="620" y="56" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#534AB7">API key</text>

<!-- Terminal -> chatbot.js -->
<line x1="140" y1="35" x2="208" y2="35" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="174" y="28" text-anchor="middle" font-size="9" fill="#5F5E5A">Input</text>

<!-- chatbot.js -> Terminal -->
<line x1="208" y1="55" x2="140" y2="55" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="174" y="78" text-anchor="middle" font-size="9" fill="#5F5E5A">Stream</text>

<!-- chatbot.js -> Gemini -->
<line x1="340" y1="35" x2="408" y2="35" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="374" y="28" text-anchor="middle" font-size="9" fill="#5F5E5A">Prompt</text>

<!-- Gemini -> chatbot.js -->
<line x1="408" y1="55" x2="340" y2="55" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>
<text x="374" y="78" text-anchor="middle" font-size="9" fill="#5F5E5A">Response</text>

<!-- .env -> chatbot.js (L-shaped arrow going beneath) -->
<path d="M620 70 L620 110 L275 110 L275 72" fill="none" stroke="#AFA9EC" stroke-width="1" marker-end="url(#a)"/>
<text x="448" y="125" text-anchor="middle" font-size="9" fill="#534AB7">Reads API key</text>

