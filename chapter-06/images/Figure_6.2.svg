<svg viewBox="0 0 750 320" xmlns="http://www.w3.org/2000/svg" font-family="Palatino Linotype, serif" font-size="13">
  <!-- Title -->
  <text x="375" y="25" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Keyword Search vs Semantic Search</text>

  <!-- Query box -->
  <rect x="260" y="45" width="230" height="40" rx="5" fill="#EEEDFE" stroke="#6B46C1" stroke-width="1.2"/>
  <text x="375" y="70" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Query: "fix broken laptop screen"</text>

  <!-- Branch lines -->
  <line x1="320" y1="85" x2="170" y2="115" stroke="#555" stroke-width="1.2"/>
  <line x1="430" y1="85" x2="580" y2="115" stroke="#555" stroke-width="1.2"/>

  <!-- Left: Keyword Search -->
  <rect x="40" y="115" width="260" height="35" rx="5" fill="#FAECE7" stroke="#E74C3C" stroke-width="1.2"/>
  <text x="170" y="138" text-anchor="middle" font-weight="bold" fill="#E74C3C">Keyword Search</text>
  <text x="170" y="165" text-anchor="middle" font-size="11" fill="#888">Matches exact words</text>

  <!-- Keyword results -->
  <rect x="40" y="180" width="260" height="35" rx="4" fill="#E1F5EE" stroke="#276749" stroke-width="1"/>
  <text x="50" y="202" font-size="11" fill="#276749">&#x2713;</text>
  <text x="65" y="202" font-size="11" fill="#333">"How to Fix a Broken Laptop Screen"</text>

  <rect x="40" y="222" width="260" height="35" rx="4" fill="#FAECE7" stroke="#E74C3C" stroke-width="1"/>
  <text x="50" y="244" font-size="11" fill="#E74C3C">&#x2717;</text>
  <text x="65" y="244" font-size="11" fill="#333">"Replacing a Cracked Display"</text>

  <rect x="40" y="264" width="260" height="35" rx="4" fill="#FAECE7" stroke="#E74C3C" stroke-width="1"/>
  <text x="50" y="286" font-size="11" fill="#E74C3C">&#x2717;</text>
  <text x="65" y="286" font-size="11" fill="#333">"Notebook Monitor Repair Guide"</text>

  <!-- Right: Semantic Search -->
  <rect x="450" y="115" width="260" height="35" rx="5" fill="#E1F5EE" stroke="#276749" stroke-width="1.2"/>
  <text x="580" y="138" text-anchor="middle" font-weight="bold" fill="#276749">Semantic Search</text>
  <text x="580" y="165" text-anchor="middle" font-size="11" fill="#888">Matches meaning</text>

  <!-- Semantic results -->
  <rect x="450" y="180" width="260" height="35" rx="4" fill="#E1F5EE" stroke="#276749" stroke-width="1"/>
  <text x="460" y="202" font-size="11" fill="#276749">&#x2713;</text>
  <text x="475" y="202" font-size="11" fill="#333">"How to Fix a Broken Laptop Screen"</text>

  <rect x="450" y="222" width="260" height="35" rx="4" fill="#E1F5EE" stroke="#276749" stroke-width="1"/>
  <text x="460" y="244" font-size="11" fill="#276749">&#x2713;</text>
  <text x="475" y="244" font-size="11" fill="#333">"Replacing a Cracked Display"</text>

  <rect x="450" y="264" width="260" height="35" rx="4" fill="#E1F5EE" stroke="#276749" stroke-width="1"/>
  <text x="460" y="286" font-size="11" fill="#276749">&#x2713;</text>
  <text x="475" y="286" font-size="11" fill="#333">"Notebook Monitor Repair Guide"</text>
</svg>
