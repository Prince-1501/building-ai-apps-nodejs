<svg viewBox="0 0 750 280" xmlns="http://www.w3.org/2000/svg" font-family="Palatino Linotype, serif" font-size="13">
  <text x="360" y="25" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Chatbot vs AI Agent</text>

  <!-- Left: Chatbot -->
  <rect x="20" y="50" width="310" height="210" rx="8" fill="#F8F9FA" stroke="#E74C3C" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="175" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#E74C3C">Chatbot</text>

  <rect x="55" y="95" width="100" height="35" rx="4" fill="#EEEDFE" stroke="#6B46C1" stroke-width="1"/>
  <text x="105" y="117" text-anchor="middle" font-size="11" fill="#1a1a1a">User</text>

  <line x1="155" y1="112" x2="190" y2="112" stroke="#555" stroke-width="1"/>
  <polygon points="188,108 188,116 195,112" fill="#555"/>

  <rect x="195" y="95" width="100" height="35" rx="4" fill="#FAEEDA" stroke="#B7791F" stroke-width="1"/>
  <text x="245" y="117" text-anchor="middle" font-size="11" fill="#1a1a1a">LLM</text>

  <line x1="245" y1="130" x2="245" y2="160" stroke="#555" stroke-width="1"/>
  <polygon points="240,158 250,158 245,165" fill="#555"/>

  <rect x="195" y="165" width="100" height="35" rx="4" fill="#FAECE7" stroke="#E74C3C" stroke-width="1"/>
  <text x="245" y="187" text-anchor="middle" font-size="11" fill="#E74C3C">Text Only</text>

  <text x="175" y="230" text-anchor="middle" font-size="10" fill="#888">Can only generate text</text>
  <text x="175" y="245" text-anchor="middle" font-size="10" fill="#888">No tools, no actions</text>

  <!-- Right: Agent -->
  <rect x="390" y="50" width="350" height="210" rx="8" fill="#F8F9FA" stroke="#276749" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="565" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#276749">AI Agent</text>

  <rect x="425" y="95" width="100" height="35" rx="4" fill="#EEEDFE" stroke="#6B46C1" stroke-width="1"/>
  <text x="475" y="117" text-anchor="middle" font-size="11" fill="#1a1a1a">User</text>

  <line x1="525" y1="112" x2="560" y2="112" stroke="#555" stroke-width="1"/>
  <polygon points="558,108 558,116 565,112" fill="#555"/>

  <rect x="565" y="95" width="100" height="35" rx="4" fill="#FAEEDA" stroke="#B7791F" stroke-width="1"/>
  <text x="615" y="117" text-anchor="middle" font-size="11" fill="#1a1a1a">LLM Brain</text>

  <!-- Tools branching -->
  <line x1="615" y1="130" x2="615" y2="150" stroke="#276749" stroke-width="1"/>
  <line x1="615" y1="150" x2="470" y2="170" stroke="#276749" stroke-width="1"/>
  <line x1="615" y1="150" x2="545" y2="170" stroke="#276749" stroke-width="1"/>
  <line x1="615" y1="150" x2="620" y2="170" stroke="#276749" stroke-width="1"/>
  <line x1="615" y1="150" x2="690" y2="170" stroke="#276749" stroke-width="1"/>

  <rect x="435" y="170" width="68" height="28" rx="3" fill="#E1F5EE" stroke="#276749" stroke-width="1"/>
  <text x="469" y="189" text-anchor="middle" font-size="9" fill="#276749">Calculator</text>

  <rect x="510" y="170" width="68" height="28" rx="3" fill="#E1F5EE" stroke="#276749" stroke-width="1"/>
  <text x="544" y="189" text-anchor="middle" font-size="9" fill="#276749">Files</text>

  <rect x="585" y="170" width="68" height="28" rx="3" fill="#E1F5EE" stroke="#276749" stroke-width="1"/>
  <text x="619" y="189" text-anchor="middle" font-size="9" fill="#276749">APIs</text>

  <rect x="660" y="170" width="68" height="28" rx="3" fill="#E1F5EE" stroke="#276749" stroke-width="1"/>
  <text x="694" y="189" text-anchor="middle" font-size="9" fill="#276749">Web</text>

  <text x="565" y="225" text-anchor="middle" font-size="10" fill="#888">Reasons, decides, acts</text>
  <text x="565" y="240" text-anchor="middle" font-size="10" fill="#888">Uses tools autonomously</text>
</svg>
