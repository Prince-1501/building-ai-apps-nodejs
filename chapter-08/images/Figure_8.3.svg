<svg viewBox="0 0 550 380" xmlns="http://www.w3.org/2000/svg" font-family="Palatino Linotype, serif" font-size="13">
  <text x="275" y="25" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">The ReAct Agent Loop</text>

  <!-- User question -->
  <rect x="185" y="45" width="180" height="35" rx="5" fill="#EEEDFE" stroke="#6B46C1" stroke-width="1.2"/>
  <text x="275" y="68" text-anchor="middle" font-weight="bold" fill="#6B46C1">User Question</text>

  <line x1="275" y1="80" x2="275" y2="105" stroke="#555" stroke-width="1.2"/>
  <polygon points="270,103 280,103 275,110" fill="#555"/>

  <!-- Observe -->
  <rect x="185" y="110" width="180" height="40" rx="5" fill="#E6F1FB" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="275" y="135" text-anchor="middle" font-weight="bold" fill="#2B6CB0">1. Observe</text>

  <line x1="275" y1="150" x2="275" y2="170" stroke="#555" stroke-width="1.2"/>
  <polygon points="270,168 280,168 275,175" fill="#555"/>

  <!-- Think -->
  <rect x="185" y="175" width="180" height="40" rx="5" fill="#FAEEDA" stroke="#B7791F" stroke-width="1.5"/>
  <text x="275" y="200" text-anchor="middle" font-weight="bold" fill="#B7791F">2. Think</text>

  <line x1="275" y1="215" x2="275" y2="235" stroke="#555" stroke-width="1.2"/>
  <polygon points="270,233 280,233 275,240" fill="#555"/>

  <!-- Act -->
  <rect x="185" y="240" width="180" height="40" rx="5" fill="#E1F5EE" stroke="#276749" stroke-width="1.5"/>
  <text x="275" y="265" text-anchor="middle" font-weight="bold" fill="#276749">3. Act (call tool)</text>

  <!-- Loop back arrow -->
  <line x1="365" y1="260" x2="430" y2="260" stroke="#E74C3C" stroke-width="1.5"/>
  <line x1="430" y1="260" x2="430" y2="130" stroke="#E74C3C" stroke-width="1.5"/>
  <line x1="430" y1="130" x2="365" y2="130" stroke="#E74C3C" stroke-width="1.5"/>
  <polygon points="370,126 370,134 363,130" fill="#E74C3C"/>

  <text x="455" y="200" font-size="11" font-weight="bold" fill="#E74C3C">Repeat</text>
  <text x="455" y="215" font-size="10" fill="#E74C3C">until done</text>

  <!-- Done arrow -->
  <line x1="275" y1="280" x2="275" y2="310" stroke="#555" stroke-width="1.2"/>
  <polygon points="270,308 280,308 275,315" fill="#555"/>
  <text x="315" y="300" font-size="10" fill="#888">task complete</text>

  <!-- Final answer -->
  <rect x="185" y="315" width="180" height="35" rx="5" fill="#E1F5EE" stroke="#276749" stroke-width="1.5"/>
  <text x="275" y="338" text-anchor="middle" font-weight="bold" fill="#276749">Final Answer</text>

  <!-- Side labels -->
  <text x="140" y="133" text-anchor="end" font-size="10" fill="#2B6CB0">What do we know?</text>
  <text x="140" y="198" text-anchor="end" font-size="10" fill="#B7791F">Which tool to use?</text>
  <text x="140" y="263" text-anchor="end" font-size="10" fill="#276749">Execute the tool</text>
</svg>
