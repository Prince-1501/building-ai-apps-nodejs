<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" font-family="Palatino Linotype, serif" font-size="13">
  <text x="360" y="25" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Function Calling Flow</text>

  <!-- Step 1 -->
  <text x="120" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#2B6CB0">Step 1: Define</text>
  <rect x="30" y="65" width="180" height="70" rx="5" fill="#E6F1FB" stroke="#2B6CB0" stroke-width="1.2"/>
  <text x="120" y="88" text-anchor="middle" font-size="11" fill="#1a1a1a">Developer defines</text>
  <text x="120" y="104" text-anchor="middle" font-size="11" fill="#1a1a1a">available tools with</text>
  <text x="120" y="120" text-anchor="middle" font-size="11" fill="#1a1a1a">name + description</text>

  <line x1="210" y1="100" x2="255" y2="100" stroke="#555" stroke-width="1.2"/>
  <polygon points="253,96 253,104 260,100" fill="#555"/>

  <!-- Step 2 -->
  <text x="360" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#B7791F">Step 2: Decide</text>
  <rect x="260" y="65" width="200" height="70" rx="5" fill="#FAEEDA" stroke="#B7791F" stroke-width="1.2"/>
  <text x="360" y="88" text-anchor="middle" font-size="11" fill="#1a1a1a">Model receives query</text>
  <text x="360" y="104" text-anchor="middle" font-size="11" fill="#1a1a1a">and decides to call a</text>
  <text x="360" y="120" text-anchor="middle" font-size="11" fill="#1a1a1a">function with arguments</text>

  <line x1="460" y1="100" x2="505" y2="100" stroke="#555" stroke-width="1.2"/>
  <polygon points="503,96 503,104 510,100" fill="#555"/>

  <!-- Step 3 -->
  <text x="610" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#276749">Step 3: Execute</text>
  <rect x="510" y="65" width="180" height="70" rx="5" fill="#E1F5EE" stroke="#276749" stroke-width="1.2"/>
  <text x="600" y="88" text-anchor="middle" font-size="11" fill="#1a1a1a">Our code runs the</text>
  <text x="600" y="104" text-anchor="middle" font-size="11" fill="#1a1a1a">function and sends</text>
  <text x="600" y="120" text-anchor="middle" font-size="11" fill="#1a1a1a">result back to model</text>

  <!-- Return arrow -->
  <line x1="600" y1="135" x2="600" y2="170" stroke="#276749" stroke-width="1.2"/>
  <line x1="600" y1="170" x2="360" y2="170" stroke="#276749" stroke-width="1.2"/>
  <polygon points="365,166 365,174 358,170" fill="#276749"/>

  <!-- Final answer -->
  <rect x="260" y="185" width="200" height="40" rx="5" fill="#EEEDFE" stroke="#6B46C1" stroke-width="1.2"/>
  <text x="360" y="210" text-anchor="middle" font-weight="bold" fill="#6B46C1">Final Answer</text>

  <line x1="360" y1="170" x2="360" y2="185" stroke="#555" stroke-width="1"/>
  <polygon points="355,183 365,183 360,190" fill="#555"/>

  <text x="500" y="190" font-size="10" fill="#888">Model uses result to</text>
  <text x="500" y="203" font-size="10" fill="#888">generate human answer</text>
</svg>
